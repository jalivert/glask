name: Haskell CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.10.1'
        cabal-version: '3.12'

    - name: Cache
      uses: actions/cache@v4
      env:
        cache-name: cache-cabal
      with:
        path: |
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-build-${{ env.cache-name }}-ghc-9.10.1-${{ hashFiles('**/*.cabal') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-

    - name: Install lexer/parser generators
      run: |
        sudo apt-get update
        sudo apt-get install -y alex happy
    - name: Install dependencies
      run: |
        cabal update
        cabal build --only-dependencies --enable-tests
    - name: Build
      run: cabal build all --enable-tests
    - name: Run tests
      run: cabal test all
